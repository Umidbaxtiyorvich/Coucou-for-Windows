name: Windows o‘rnatuvchisini yig‘ish

# Coucou for Windows’ning o‘zbekcha versiyasini Windows serverida yig‘adi va
# tayyor setup.exe ni shu ishga (Actions → Artifacts) biriktiradi.
# Hech qanday ommaviy reliz e’lon qilinmaydi.

on:
  push:
    branches: ['**']
    paths:
      - 'windows/**'
      - 'NotchBuddy/Resources/sounds/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Mochi's Uzbek voice (windows/scripts/uz-voice): Meta's MMS model turned into
  # ONNX once, then kept in the cache until the scripts change.
  voice-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache the voice
        id: cache
        uses: actions/cache@v4
        with:
          path: uz-voice
          key: uz-voice-${{ hashFiles('windows/scripts/uz-voice/build.sh', 'windows/scripts/uz-voice/export.py') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build the Uzbek voice
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash windows/scripts/uz-voice/build.sh uz-voice

      - name: Say a few sentences with it
        run: |
          python -m pip install -q sherpa-onnx numpy
          python windows/scripts/uz-voice/sample.py uz-voice

      - uses: actions/upload-artifact@v4
        with:
          name: uz-voice
          path: |
            uz-voice/model.onnx
            uz-voice/tokens.txt
            uz-voice/LICENSE.txt
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: Mochi-ovoz-namunasi
          path: uz-voice/sample.wav
          retention-days: 7

  build:
    needs: voice-model
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: uz-voice
          path: windows/src-tauri/voices/uz

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-uz-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-uz-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # tauri.conf.json bundles coucou-hook.exe, so it must exist before any build.
      - name: Rust tests (i18n, Uzbek voice)
        run: |
          cargo build --release -p coucou-hook
          cargo test -p coucou --lib i18n
          cargo test -p coucou --lib uzvoice

      - name: Build and pack the installer
        id: pack
        shell: pwsh
        run: |
          npm run pack
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Coucou-Uzbek-${{ steps.pack.outputs.version }}-setup
          path: windows/release/Coucou-Uzbek-${{ steps.pack.outputs.version }}-setup.exe
          retention-days: 7
